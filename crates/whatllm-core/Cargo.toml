[package]
name = "whatllm-core"
description = "Physics of running an LLM locally: architecture-exact memory, throughput and cost models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The domain is full of legitimate float math and wide numeric conversions.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
# Domain names legitimately rhyme: qk_rope/qk_nope, at_4k/at_64k.
similar_names = "allow"
must_use_candidate = "allow"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
