[package]
name = "whatrunshere-cli"
description = "WhatRunsHere on the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "whatrunshere"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# One report is one function; splitting it to satisfy a line count would
# scatter it across helpers that exist only to be short.
too_many_lines = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
whatrunshere-core = { version = "0.1.0", path = "../whatrunshere-core" }
whatrunshere-hw = { version = "0.1.0", path = "../whatrunshere-hw" }
whatrunshere-state = { workspace = true }
whatrunshere-providers = { workspace = true }
whatrunshere-probe = { version = "0.1.0", path = "../whatrunshere-probe" }
