name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Hardware detection is the part most likely to break per platform, and
        # it is the part a Linux-only pipeline would never exercise.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri draws through the system webview, which on Linux is a package
      # rather than part of the OS.
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `tauri::generate_context!` reads the built front end at compile time,
      # so the window will not build until this has run. It is also the only
      # thing that type-checks the TypeScript.
      - name: Build the front end
        run: npm ci && npm run build
        working-directory: ui

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

  catalog-guard:
    name: catalog guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The guard that stops a rebuild quietly shrinking the catalog. It runs
      # here as well as in the nightly job, so a change to the builder cannot
      # disarm it without the pull request going red.
      - name: Catalog safety guard
        run: python tools/test_catalog_safety.py
