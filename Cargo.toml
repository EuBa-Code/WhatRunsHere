[workspace]
resolver = "2"
members = [
    "crates/whatrunshere-core",
    "crates/whatrunshere-hw",
    "crates/whatrunshere-probe",
    "crates/whatrunshere-state",
    "crates/whatrunshere-providers",
    "crates/whatrunshere-cli",
    "crates/whatrunshere-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EuBa-Code/WhatRunsHere"
authors = ["Eugenio Barberini"]

[workspace.dependencies]
whatrunshere-core = { path = "crates/whatrunshere-core", version = "0.1.0" }
whatrunshere-hw = { path = "crates/whatrunshere-hw", version = "0.1.0" }
whatrunshere-probe = { path = "crates/whatrunshere-probe", version = "0.1.0" }
whatrunshere-state = { path = "crates/whatrunshere-state", version = "0.1.0" }
whatrunshere-providers = { path = "crates/whatrunshere-providers", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# A benchmark compiled without optimisation measures the compiler, not the
# machine: the unoptimised streaming loop reports around 0.3 GB/s on hardware
# that sustains 40. The probe is therefore optimised in every profile, so that
# `cargo run` and `cargo test` measure the same thing a release build does.
[profile.dev.package.whatrunshere-probe]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
